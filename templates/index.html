<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 16px;
            margin: 15px 0;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            font-size: 17px;
        }
    </style>
</head>
<body>

    <h1>Emotion Detector</h1>

    <p>Enter a statement to detect its emotions.</p>

    <textarea id="textToAnalyze"
              placeholder="Enter your statement here..."></textarea>

    <br>

    <button onclick="detectEmotion()">Detect Emotion</button>

    <div id="result"></div>

    <script>
        function detectEmotion() {
            const text = document.getElementById("textToAnalyze").value.trim();
            const result = document.getElementById("result");

            if (!text) {
                result.textContent = "Please enter a statement to analyze.";
                return;
            }

            fetch(
                "/emotionDetector?textToAnalyze=" +
                encodeURIComponent(text)
            )
                .then(response => response.text())
                .then(data => {
                    result.textContent = data;
                })
                .catch(error => {
                    result.textContent =
                        "An error occurred while analyzing the statement.";
                    console.error(error);
                });
        }
    </script>

</body>
</html>
